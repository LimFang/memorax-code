name: windows-npm

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-npm-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/ts/memorax-code-backend/package-lock.json
      - name: Build and pack release-shaped npm artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --prefix packages/ts/memorax-code-backend
          npm run build --prefix packages/ts/memorax-code-backend
          node --test --test-timeout=30000 `
            packages/ts/memorax-code-backend/test/backend-process.test.mjs
          node --test --test-timeout=30000 `
            --test-name-pattern='service start accepts matching health|Windows managed stop' `
            packages/ts/memorax-code-backend/test/service-lifecycle.test.mjs
          node --test --test-timeout=90000 `
            --test-name-pattern='Backend stop refusal leaves lifecycle adapters and active clients unchanged' `
            packages/ts/memorax-code-backend/test/backend-service.test.mjs
          node --test --test-timeout=15000 `
            packages/ts/memorax-code-backend/test/repository-memory-scope.test.mjs
          node --test --test-timeout=5000 `
            --test-name-pattern='memory CLI searches within a readable non-Git workspace scope|memory CLI accepts a sibling linked worktree from the current turn repository|memory CLI add writes a short memory through MemoraX' `
            packages/ts/memorax-code-backend/test/memory-cli.test.mjs
          node scripts/build-npm-packages.mjs --out-dir dist/npm

          $manifestPath = 'dist/npm/memorax-code/package.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $baselineVersion = $manifest.version
          $versionMatch = [regex]::Match(
            $baselineVersion,
            '^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$'
          )
          if (-not $versionMatch.Success) {
            throw 'Windows E2E baseline must be a valid semantic version'
          }
          $major = $versionMatch.Groups[1].Value
          $minor = $versionMatch.Groups[2].Value
          $patch = [int]$versionMatch.Groups[3].Value + 1
          $nextVersion = "$major.$minor.$patch-windows-e2e.0"

          New-Item -ItemType Directory -Force dist/npm/tarballs | Out-Null
          npm pack dist/npm/memorax-code --pack-destination dist/npm/tarballs --json |
            Out-File dist/npm/baseline-pack.json -Encoding utf8
          node scripts/validate-npm-pack-json.mjs dist/npm/baseline-pack.json

          $manifest.version = $nextVersion
          $manifest | ConvertTo-Json -Depth 20 |
            Out-File $manifestPath -Encoding utf8
          foreach ($pluginPath in @(
            'dist/npm/memorax-code/lib/memorax-code-codex-adapter/.codex-plugin/plugin.json',
            'dist/npm/memorax-code/lib/memorax-code-claude-adapter/.claude-plugin/plugin.json',
            'dist/npm/memorax-code/lib/memorax-code-claude-marketplace/plugins/memorax-code-claude-adapter/.claude-plugin/plugin.json'
          )) {
            $plugin = Get-Content $pluginPath -Raw | ConvertFrom-Json
            $plugin.version = $nextVersion
            $plugin | ConvertTo-Json -Depth 20 |
              Out-File $pluginPath -Encoding utf8
          }
          npm pack dist/npm/memorax-code --pack-destination dist/npm/tarballs --json |
            Out-File dist/npm/next-pack.json -Encoding utf8
          node scripts/validate-npm-pack-json.mjs dist/npm/next-pack.json

          $baselinePack = (Get-Content dist/npm/baseline-pack.json -Raw | ConvertFrom-Json)[0]
          $nextPack = (Get-Content dist/npm/next-pack.json -Raw | ConvertFrom-Json)[0]
          if ($baselinePack.name -ne '@memorax/memorax-code' -or
              $nextPack.name -ne '@memorax/memorax-code' -or
              $baselinePack.version -ne $baselineVersion -or
              $nextPack.version -ne $nextVersion) {
            throw 'Windows npm artifact identity or version mismatch'
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-npm-release-package
          path: |
            dist/npm/baseline-pack.json
            dist/npm/next-pack.json
            dist/npm/tarballs/*.tgz
          retention-days: 7

  windows-npm-package:
    needs: windows-npm-build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          name: windows-npm-release-package
          path: dist/npm
      - name: Verify package lifecycle, recovery, update, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $repo = $env:GITHUB_WORKSPACE
          $harness = (Resolve-Path scripts/windows-npm-package-e2e.mjs).Path
          npm install -g verdaccio@6.8.0
          $verdaccioCommand = (Get-Command verdaccio.cmd).Source
          $nodeExe = (Get-Command node).Source
          $nodeDir = Split-Path $nodeExe
          $npmCli = Join-Path $nodeDir 'node_modules/npm/bin/npm-cli.js'
          if (-not (Test-Path $npmCli)) { throw 'npm CLI JavaScript entrypoint is missing' }

          $root = Join-Path $env:RUNNER_TEMP 'MemoraX Code Package Node 24 中文'
          $prefix = Join-Path $root 'npm prefix'
          $workspace = Join-Path $root 'isolated workspace'
          $registryRoot = Join-Path $root 'registry'
          $env:HOME = Join-Path $root 'home'
          $env:USERPROFILE = $env:HOME
          $env:APPDATA = Join-Path $root 'app data'
          $env:LOCALAPPDATA = Join-Path $root 'local data'
          $env:CODEX_HOME = Join-Path $root 'codex home'
          $env:CLAUDE_CONFIG_DIR = Join-Path $root 'claude home'
          $env:MEMORAX_CODE_HOME = Join-Path $root 'memorax-code home'
          $env:NPM_CONFIG_PREFIX = $prefix
          $env:NPM_CONFIG_CACHE = Join-Path $root 'npm cache'
          $env:NPM_CONFIG_USERCONFIG = Join-Path $root 'npmrc'
          $env:NPM_CONFIG_REGISTRY = 'http://127.0.0.1:4873'
          $env:MEMORAX_CODE_NPM_EXEC_PATH = $npmCli
          $env:MEMORAX_CODE_BACKEND_PORT = '18787'
          $env:PATH = "$prefix;$nodeDir;$env:SystemRoot\System32"
          New-Item -ItemType Directory -Force `
            $registryRoot, $workspace, $env:MEMORAX_CODE_HOME | Out-Null

          "WINDOWS_PACKAGE_PREFIX=$prefix" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_PACKAGE_HOME=$env:HOME" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_PACKAGE_USERPROFILE=$env:USERPROFILE" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_PACKAGE_APPDATA=$env:APPDATA" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_PACKAGE_LOCALAPPDATA=$env:LOCALAPPDATA" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_PACKAGE_CODEX_HOME=$env:CODEX_HOME" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_PACKAGE_CLAUDE_HOME=$env:CLAUDE_CONFIG_DIR" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_PACKAGE_MEMORAX_CODE_HOME=$env:MEMORAX_CODE_HOME" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          @'
          [clients]
          codex = false
          claude = false
          '@ | Out-File (Join-Path $env:MEMORAX_CODE_HOME 'config.toml') -Encoding utf8
          @'
          storage: ./storage
          auth:
            htpasswd:
              file: ./htpasswd
              max_users: -1
          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
          packages:
            '@memorax/*':
              access: $all
              publish: $all
            '**':
              access: $all
              publish: $all
              proxy: npmjs
          log: { type: stdout, format: pretty, level: warn }
          '@ | Out-File (Join-Path $registryRoot 'config.yaml') -Encoding utf8

          $baselinePack = (Get-Content dist/npm/baseline-pack.json -Raw | ConvertFrom-Json)[0]
          $nextPack = (Get-Content dist/npm/next-pack.json -Raw | ConvertFrom-Json)[0]
          $baseline = Get-ChildItem dist/npm -Recurse -Filter $baselinePack.filename |
            Select-Object -First 1
          $next = Get-ChildItem dist/npm -Recurse -Filter $nextPack.filename |
            Select-Object -First 1
          if (-not $baseline -or -not $next) {
            throw 'release-shaped npm tarballs were not downloaded'
          }
          $channel = if ($baselinePack.version.Contains('-')) { 'preview' } else { 'latest' }

          $verdaccio = Start-Process $verdaccioCommand `
            -ArgumentList '--config', (Join-Path $registryRoot 'config.yaml'), `
              '--listen', '127.0.0.1:4873' `
            -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($index = 0; $index -lt 40; $index += 1) {
              try {
                Invoke-WebRequest http://127.0.0.1:4873/-/ping -UseBasicParsing |
                  Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw 'local registry did not become ready' }
            npm config set //127.0.0.1:4873/:_authToken ci-token
            npm publish $baseline.FullName --access public --tag $channel
            npm publish $next.FullName --access public --tag $channel

            Set-Location $workspace
            $env:MEMORAX_CODE_SKIP_POSTINSTALL = '1'
            npm install -g "@memorax/memorax-code@$($baselinePack.version)" `
              --foreground-scripts
            $backendState = Join-Path $env:MEMORAX_CODE_HOME 'runtime/backend/backend.pid.json'
            if (Test-Path $backendState) {
              throw 'skipped postinstall unexpectedly started the Backend'
            }
            Remove-Item Env:MEMORAX_CODE_SKIP_POSTINSTALL

            npm install -g "@memorax/memorax-code@$($baselinePack.version)" `
              --force --foreground-scripts
            $memoraxCode = Join-Path $prefix `
              'node_modules/@memorax/memorax-code/bin/memorax-code.mjs'
            $recovered = node $memoraxCode status --json --clients none --port 18787 |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $recovered.backend.ok -ne $true) {
              throw 'repeat install did not recover the Backend'
            }
            node $memoraxCode uninstall --json --clients none --port 18787 | Out-Null
            if ($LASTEXITCODE -ne 0 -or (Test-Path $memoraxCode)) {
              throw 'recovery setup uninstall failed'
            }

            npm install -g "@memorax/memorax-code@$($baselinePack.version)" `
              --foreground-scripts
            $memoraxCode = Join-Path $prefix `
              'node_modules/@memorax/memorax-code/bin/memorax-code.mjs'
            $manifest = Get-Content `
              (Join-Path $prefix 'node_modules/@memorax/memorax-code/package.json') `
              -Raw | ConvertFrom-Json
            foreach ($name in @($manifest.bin.PSObject.Properties.Name)) {
              $shim = Join-Path $prefix "$name.cmd"
              if (-not (Test-Path $shim)) { throw "npm .cmd shim missing: $name" }
              & $shim --help | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "npm bin shim failed: $name" }
            }
            $memoraxCodeShim = Join-Path $prefix 'memorax-code.cmd'
            $memoraxCliShim = Join-Path $prefix 'memorax-cli.cmd'
            & $memoraxCodeShim --version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'memorax-code.cmd --version failed' }
            $env:MEMORAX_CODE_MEMORAX_ENDPOINT = 'https://platform.memorax.net'
            $env:MEMORAX_CODE_MEMORAX_API_KEY = 'windows-package-check-key'
            $env:MEMORAX_CODE_MEMORAX_USER_ID = 'windows-package-check-user'
            $memoryStatus = & $memoraxCliShim status --json --config-only | ConvertFrom-Json
            Remove-Item Env:MEMORAX_CODE_MEMORAX_ENDPOINT
            Remove-Item Env:MEMORAX_CODE_MEMORAX_API_KEY
            Remove-Item Env:MEMORAX_CODE_MEMORAX_USER_ID
            if ($LASTEXITCODE -ne 0 -or $memoryStatus.action -ne 'memory.status' -or $memoryStatus.ok -ne $true) {
              throw 'memorax-cli.cmd status failed'
            }
            & $memoraxCodeShim stop --json --clients none --port 18787 | Out-Null
            & $memoraxCodeShim start --json --clients none --port 18787 | Out-Null
            & $memoraxCodeShim stop --json --clients none --port 18787 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'memorax-code.cmd lifecycle failed' }

            node $harness --prefix $prefix --workspace $workspace `
              --mode lifecycle --port 18787 `
              --bin-shims-verified true `
              --cmd-lifecycle-verified true `
              --interrupted-install-recovered true |
              Tee-Object (Join-Path $repo 'dist/npm/windows-package-report.json')
            if ($LASTEXITCODE -ne 0) { throw 'package lifecycle harness failed' }
            node (Join-Path $repo 'scripts/validate-windows-e2e-report.mjs') `
              lifecycle (Join-Path $repo 'dist/npm/windows-package-report.json')

            $oldState = Get-Content $backendState -Raw | ConvertFrom-Json
            $oldPid = $oldState.pid
            & $memoraxCodeShim update
            if ($LASTEXITCODE -ne 0) { throw 'memorax-code update failed' }

            node $harness --prefix $prefix --workspace $workspace `
              --mode updated --old-pid $oldPid --port 18787 `
              --expected-version $nextPack.version `
              --baseline-version $baselinePack.version |
              Tee-Object (Join-Path $repo 'dist/npm/windows-update-report.json')
            if ($LASTEXITCODE -ne 0) { throw 'package update harness failed' }
            node (Join-Path $repo 'scripts/validate-windows-e2e-report.mjs') `
              updated (Join-Path $repo 'dist/npm/windows-update-report.json')
          } finally {
            Stop-Process -Id $verdaccio.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Create redacted package failure diagnostics and clean up
        if: failure()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'MemoraX Code Package Node 24 中文'
          $prefix = if ($env:WINDOWS_PACKAGE_PREFIX) {
            $env:WINDOWS_PACKAGE_PREFIX
          } else {
            Join-Path $root 'npm prefix'
          }
          $env:HOME = if ($env:WINDOWS_PACKAGE_HOME) {
            $env:WINDOWS_PACKAGE_HOME
          } else {
            Join-Path $root 'home'
          }
          $env:USERPROFILE = if ($env:WINDOWS_PACKAGE_USERPROFILE) {
            $env:WINDOWS_PACKAGE_USERPROFILE
          } else {
            $env:HOME
          }
          $env:APPDATA = if ($env:WINDOWS_PACKAGE_APPDATA) {
            $env:WINDOWS_PACKAGE_APPDATA
          } else {
            Join-Path $root 'app data'
          }
          $env:LOCALAPPDATA = if ($env:WINDOWS_PACKAGE_LOCALAPPDATA) {
            $env:WINDOWS_PACKAGE_LOCALAPPDATA
          } else {
            Join-Path $root 'local data'
          }
          $env:CODEX_HOME = if ($env:WINDOWS_PACKAGE_CODEX_HOME) {
            $env:WINDOWS_PACKAGE_CODEX_HOME
          } else {
            Join-Path $root 'codex home'
          }
          $env:CLAUDE_CONFIG_DIR = if ($env:WINDOWS_PACKAGE_CLAUDE_HOME) {
            $env:WINDOWS_PACKAGE_CLAUDE_HOME
          } else {
            Join-Path $root 'claude home'
          }
          $env:MEMORAX_CODE_HOME = if ($env:WINDOWS_PACKAGE_MEMORAX_CODE_HOME) {
            $env:WINDOWS_PACKAGE_MEMORAX_CODE_HOME
          } else {
            Join-Path $root 'memorax-code home'
          }
          $memoraxCode = Join-Path $prefix `
            'node_modules/@memorax/memorax-code/bin/memorax-code.mjs'
          $assertions = if (Test-Path dist/npm/windows-update-report.json) {
            'dist/npm/windows-update-report.json'
          } else {
            'dist/npm/windows-package-report.json'
          }
          try {
            node scripts/write-windows-failure-diagnostics.mjs `
              --job package --prefix $prefix --assertions $assertions `
              --output dist/npm/windows-package-failure.json
            node scripts/validate-windows-e2e-report.mjs `
              failure dist/npm/windows-package-failure.json
            New-Item -ItemType File dist/npm/windows-package-failure.safe |
              Out-Null
          } finally {
            if (Test-Path $memoraxCode) {
              node $memoraxCode stop --json --clients none --port 18787 `
                2>$null | Out-Null
            }
          }
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: windows-package-node-24-results
          path: |
            dist/npm/windows-package-report.json
            dist/npm/windows-update-report.json
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('dist/npm/windows-package-failure.safe') != ''
        with:
          name: windows-package-node-24-redacted-results
          path: dist/npm/windows-package-failure.json
          retention-days: 7

  windows-npm-codex:
    needs: windows-npm-build
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          name: windows-npm-release-package
          path: dist/npm
      - name: Verify Codex plugin lifecycle and shared Hooks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $repo = $env:GITHUB_WORKSPACE
          $harness = (Resolve-Path scripts/windows-codex-e2e.mjs).Path
          $nodeDir = Split-Path (Get-Command node).Source
          $npmCli = Join-Path $nodeDir 'node_modules/npm/bin/npm-cli.js'
          if (-not (Test-Path $npmCli)) { throw 'npm CLI JavaScript entrypoint is missing' }
          $root = Join-Path $env:RUNNER_TEMP 'MemoraX Code Codex 中文'
          $prefix = Join-Path $root 'npm prefix'
          $workspace = Join-Path $root 'isolated workspace'
          $env:HOME = Join-Path $root 'home'
          $env:USERPROFILE = $env:HOME
          $env:APPDATA = Join-Path $root 'app data'
          $env:LOCALAPPDATA = Join-Path $root 'local data'
          $env:CODEX_HOME = Join-Path $root 'codex home'
          $env:MEMORAX_CODE_HOME = Join-Path $root 'memorax-code home'
          $env:NPM_CONFIG_PREFIX = $prefix
          $env:NPM_CONFIG_CACHE = Join-Path $root 'npm cache'
          $env:NPM_CONFIG_USERCONFIG = Join-Path $root 'npmrc'
          $env:MEMORAX_CODE_NPM_EXEC_PATH = $npmCli
          $env:MEMORAX_CODE_BACKEND_PORT = '18788'
          $env:PATH = "$prefix;$nodeDir;$env:SystemRoot\System32"
          $env:MEMORAX_CODE_SKIP_CLAUDE_ADAPTER_INSTALL = '1'
          New-Item -ItemType Directory -Force `
            $workspace, $env:CODEX_HOME, $env:MEMORAX_CODE_HOME | Out-Null

          "WINDOWS_CODEX_PREFIX=$prefix" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CODEX_HOME_DIR=$env:HOME" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CODEX_USERPROFILE=$env:USERPROFILE" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CODEX_APPDATA=$env:APPDATA" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CODEX_LOCALAPPDATA=$env:LOCALAPPDATA" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CODEX_CODEX_HOME=$env:CODEX_HOME" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CODEX_MEMORAX_CODE_HOME=$env:MEMORAX_CODE_HOME" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          @'
          [clients]
          codex = true
          claude = false
          '@ | Out-File (Join-Path $env:MEMORAX_CODE_HOME 'config.toml') -Encoding utf8

          $pack = (Get-Content dist/npm/baseline-pack.json -Raw | ConvertFrom-Json)[0]
          $package = Get-ChildItem dist/npm -Recurse -Filter $pack.filename |
            Select-Object -First 1
          if (-not $package) { throw 'release-shaped npm tarball was not downloaded' }

          Set-Location $workspace
          npm install -g @openai/codex@0.144.4
          npm install -g $package.FullName --foreground-scripts
          node $harness --prefix $prefix --workspace $workspace `
            --port 18788 --codex-command codex |
            Tee-Object (Join-Path $repo 'dist/npm/windows-codex-report.json')
          if ($LASTEXITCODE -ne 0) { throw 'Codex Hook harness failed' }
          node (Join-Path $repo 'scripts/validate-windows-e2e-report.mjs') `
            codex (Join-Path $repo 'dist/npm/windows-codex-report.json')
      - name: Create redacted Codex failure diagnostics and clean up
        if: failure()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'MemoraX Code Codex 中文'
          $prefix = if ($env:WINDOWS_CODEX_PREFIX) {
            $env:WINDOWS_CODEX_PREFIX
          } else {
            Join-Path $root 'npm prefix'
          }
          $env:HOME = if ($env:WINDOWS_CODEX_HOME_DIR) {
            $env:WINDOWS_CODEX_HOME_DIR
          } else {
            Join-Path $root 'home'
          }
          $env:USERPROFILE = if ($env:WINDOWS_CODEX_USERPROFILE) {
            $env:WINDOWS_CODEX_USERPROFILE
          } else {
            $env:HOME
          }
          $env:APPDATA = if ($env:WINDOWS_CODEX_APPDATA) {
            $env:WINDOWS_CODEX_APPDATA
          } else {
            Join-Path $root 'app data'
          }
          $env:LOCALAPPDATA = if ($env:WINDOWS_CODEX_LOCALAPPDATA) {
            $env:WINDOWS_CODEX_LOCALAPPDATA
          } else {
            Join-Path $root 'local data'
          }
          $env:CODEX_HOME = if ($env:WINDOWS_CODEX_CODEX_HOME) {
            $env:WINDOWS_CODEX_CODEX_HOME
          } else {
            Join-Path $root 'codex home'
          }
          $env:MEMORAX_CODE_HOME = if ($env:WINDOWS_CODEX_MEMORAX_CODE_HOME) {
            $env:WINDOWS_CODEX_MEMORAX_CODE_HOME
          } else {
            Join-Path $root 'memorax-code home'
          }
          $memoraxCode = Join-Path $prefix `
            'node_modules/@memorax/memorax-code/bin/memorax-code.mjs'
          try {
            node scripts/write-windows-failure-diagnostics.mjs `
              --job codex --prefix $prefix `
              --assertions dist/npm/windows-codex-report.json `
              --output dist/npm/windows-codex-failure.json
            node scripts/validate-windows-e2e-report.mjs `
              failure dist/npm/windows-codex-failure.json
            New-Item -ItemType File dist/npm/windows-codex-failure.safe |
              Out-Null
          } finally {
            if (Test-Path $memoraxCode) {
              node $memoraxCode stop --json --clients codex --port 18788 `
                2>$null | Out-Null
            }
          }
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: windows-codex-results
          path: dist/npm/windows-codex-report.json
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('dist/npm/windows-codex-failure.safe') != ''
        with:
          name: windows-codex-redacted-results
          path: dist/npm/windows-codex-failure.json
          retention-days: 7

  windows-npm-claude:
    needs: windows-npm-build
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          name: windows-npm-release-package
          path: dist/npm
      - name: Verify Claude plugin lifecycle and shared Hooks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $repo = $env:GITHUB_WORKSPACE
          $harness = (Resolve-Path scripts/windows-claude-e2e.mjs).Path
          $nodeDir = Split-Path (Get-Command node).Source
          $npmCli = Join-Path $nodeDir 'node_modules/npm/bin/npm-cli.js'
          if (-not (Test-Path $npmCli)) { throw 'npm CLI JavaScript entrypoint is missing' }
          $root = Join-Path $env:RUNNER_TEMP 'MemoraX Code Claude 中文'
          $prefix = Join-Path $root 'npm prefix'
          $workspace = Join-Path $root 'isolated workspace'
          $env:HOME = Join-Path $root 'home'
          $env:USERPROFILE = $env:HOME
          $env:APPDATA = Join-Path $root 'app data'
          $env:LOCALAPPDATA = Join-Path $root 'local data'
          $env:CLAUDE_CONFIG_DIR = Join-Path $root 'claude home'
          $env:MEMORAX_CODE_HOME = Join-Path $root 'memorax-code home'
          $env:NPM_CONFIG_PREFIX = $prefix
          $env:NPM_CONFIG_CACHE = Join-Path $root 'npm cache'
          $env:NPM_CONFIG_USERCONFIG = Join-Path $root 'npmrc'
          $env:MEMORAX_CODE_NPM_EXEC_PATH = $npmCli
          $env:MEMORAX_CODE_BACKEND_PORT = '18789'
          $env:MEMORAX_CODE_CLAUDE_COMMAND = 'claude'
          $env:PATH = "$prefix;$nodeDir;$env:SystemRoot\System32"
          $env:MEMORAX_CODE_SKIP_CODEX_PLUGIN_INSTALL = '1'
          New-Item -ItemType Directory -Force `
            $workspace, $env:CLAUDE_CONFIG_DIR, $env:MEMORAX_CODE_HOME | Out-Null

          "WINDOWS_CLAUDE_PREFIX=$prefix" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CLAUDE_HOME_DIR=$env:HOME" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CLAUDE_USERPROFILE=$env:USERPROFILE" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CLAUDE_APPDATA=$env:APPDATA" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CLAUDE_LOCALAPPDATA=$env:LOCALAPPDATA" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CLAUDE_CONFIG_DIR=$env:CLAUDE_CONFIG_DIR" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CLAUDE_MEMORAX_CODE_HOME=$env:MEMORAX_CODE_HOME" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          @'
          [clients]
          codex = false
          claude = true
          '@ | Out-File (Join-Path $env:MEMORAX_CODE_HOME 'config.toml') -Encoding utf8

          $pack = (Get-Content dist/npm/baseline-pack.json -Raw | ConvertFrom-Json)[0]
          $package = Get-ChildItem dist/npm -Recurse -Filter $pack.filename |
            Select-Object -First 1
          if (-not $package) { throw 'release-shaped npm tarball was not downloaded' }

          Set-Location $workspace
          npm install -g @anthropic-ai/claude-code@2.1.201
          npm install -g $package.FullName --foreground-scripts
          node $harness --prefix $prefix --workspace $workspace `
            --port 18789 --claude-command claude |
            Tee-Object (Join-Path $repo 'dist/npm/windows-claude-report.json')
          if ($LASTEXITCODE -ne 0) { throw 'Claude Hook harness failed' }
          node (Join-Path $repo 'scripts/validate-windows-e2e-report.mjs') `
            claude (Join-Path $repo 'dist/npm/windows-claude-report.json')
      - name: Create redacted Claude failure diagnostics and clean up
        if: failure()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'MemoraX Code Claude 中文'
          $prefix = if ($env:WINDOWS_CLAUDE_PREFIX) {
            $env:WINDOWS_CLAUDE_PREFIX
          } else {
            Join-Path $root 'npm prefix'
          }
          $env:HOME = if ($env:WINDOWS_CLAUDE_HOME_DIR) {
            $env:WINDOWS_CLAUDE_HOME_DIR
          } else {
            Join-Path $root 'home'
          }
          $env:USERPROFILE = if ($env:WINDOWS_CLAUDE_USERPROFILE) {
            $env:WINDOWS_CLAUDE_USERPROFILE
          } else {
            $env:HOME
          }
          $env:APPDATA = if ($env:WINDOWS_CLAUDE_APPDATA) {
            $env:WINDOWS_CLAUDE_APPDATA
          } else {
            Join-Path $root 'app data'
          }
          $env:LOCALAPPDATA = if ($env:WINDOWS_CLAUDE_LOCALAPPDATA) {
            $env:WINDOWS_CLAUDE_LOCALAPPDATA
          } else {
            Join-Path $root 'local data'
          }
          $env:CLAUDE_CONFIG_DIR = if ($env:WINDOWS_CLAUDE_CONFIG_DIR) {
            $env:WINDOWS_CLAUDE_CONFIG_DIR
          } else {
            Join-Path $root 'claude home'
          }
          $env:MEMORAX_CODE_HOME = if ($env:WINDOWS_CLAUDE_MEMORAX_CODE_HOME) {
            $env:WINDOWS_CLAUDE_MEMORAX_CODE_HOME
          } else {
            Join-Path $root 'memorax-code home'
          }
          $memoraxCode = Join-Path $prefix `
            'node_modules/@memorax/memorax-code/bin/memorax-code.mjs'
          try {
            node scripts/write-windows-failure-diagnostics.mjs `
              --job claude --prefix $prefix `
              --assertions dist/npm/windows-claude-report.json `
              --output dist/npm/windows-claude-failure.json
            node scripts/validate-windows-e2e-report.mjs `
              failure dist/npm/windows-claude-failure.json
            New-Item -ItemType File dist/npm/windows-claude-failure.safe |
              Out-Null
          } finally {
            if (Test-Path $memoraxCode) {
              node $memoraxCode stop --json --clients claude --port 18789 `
                2>$null | Out-Null
            }
          }
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: windows-claude-results
          path: dist/npm/windows-claude-report.json
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('dist/npm/windows-claude-failure.safe') != ''
        with:
          name: windows-claude-redacted-results
          path: dist/npm/windows-claude-failure.json
          retention-days: 7

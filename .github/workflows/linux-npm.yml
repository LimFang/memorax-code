name: linux-npm

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-npm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/ts/memorax-code-backend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned client CLIs
        run: |
          npm install -g \
            @openai/codex@0.144.4 \
            @anthropic-ai/claude-code@2.1.201
          codex --version
          claude --version

      - name: Build and verify the platform-neutral npm package
        run: |
          scripts/npm-package-check.sh dist/npm-linux

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const [baseline] = JSON.parse(
            readFileSync("dist/npm-linux/main-pack.json", "utf8"),
          );
          const manifestPath = "dist/npm-linux/memorax-code/package.json";
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          if (baseline?.name !== "@memorax/memorax-code"
            || baseline?.version !== manifest.version) {
            throw new Error("Linux E2E baseline must be the freshly built MemoraX Code package");
          }
          const match = baseline.version.match(
            /^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/,
          );
          if (!match) throw new Error("Linux E2E baseline must be a valid semantic version");
          const nextVersion = `${match[1]}.${match[2]}.${Number(match[3]) + 1}-linux-e2e.0`;
          manifest.version = nextVersion;
          writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

          for (const pluginPath of [
            "dist/npm-linux/memorax-code/lib/memorax-code-codex-adapter/.codex-plugin/plugin.json",
            "dist/npm-linux/memorax-code/lib/memorax-code-claude-adapter/.claude-plugin/plugin.json",
            "dist/npm-linux/memorax-code/lib/memorax-code-claude-marketplace/plugins/memorax-code-claude-adapter/.claude-plugin/plugin.json",
          ]) {
            const plugin = JSON.parse(readFileSync(pluginPath, "utf8"));
            plugin.version = nextVersion;
            writeFileSync(pluginPath, `${JSON.stringify(plugin, null, 2)}\n`);
          }
          NODE

          npm pack dist/npm-linux/memorax-code \
            --pack-destination dist/npm-linux/tarballs \
            --json > dist/npm-linux/next-pack.json
          node scripts/validate-npm-pack-json.mjs dist/npm-linux/next-pack.json

          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const baseline = JSON.parse(
            readFileSync("dist/npm-linux/main-pack.json", "utf8"),
          )[0];
          const next = JSON.parse(
            readFileSync("dist/npm-linux/next-pack.json", "utf8"),
          )[0];
          if (baseline.name !== "@memorax/memorax-code"
            || next.name !== "@memorax/memorax-code"
            || baseline.version === next.version) {
            throw new Error("Linux lifecycle artifact identity or version mismatch");
          }
          NODE

      - uses: actions/upload-artifact@v7
        with:
          name: linux-npm-release-package
          path: |
            dist/npm-linux/main-pack.json
            dist/npm-linux/next-pack.json
            dist/npm-linux/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  linux-npm-lifecycle:
    needs: linux-npm-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/download-artifact@v7
        with:
          name: linux-npm-release-package
          path: dist/npm-linux

      - name: Verify registry install, Backend lifecycle, update, and uninstall
        run: |
          npm install -g verdaccio@6.8.0
          scripts/linux-npm-registry-e2e.sh \
            dist/npm-linux \
            "dist/npm-linux/linux-lifecycle-node-24.json"

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: linux-npm-node-24-results
          path: dist/npm-linux/linux-lifecycle-node-24.json
          if-no-files-found: error
          retention-days: 7
